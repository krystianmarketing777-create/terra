# Buduje podpisany APK Terra w chmurze i publikuje go jako najnowsze wydanie.
# Stały link do pobrania: https://github.com/krystianmarketing777-create/terra/releases/latest/download/terra.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Zależności i synchronizacja Capacitora
        run: |
          npm ci
          npm run www
          npx cap sync android

      - name: Klucz podpisu
        env:
          TERRA_KEYSTORE_B64: ${{ secrets.TERRA_KEYSTORE_B64 }}
        run: echo "$TERRA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/terra.p12"

      - name: Budowa APK
        working-directory: android
        env:
          TERRA_KEYSTORE: ${{ runner.temp }}/terra.p12
          TERRA_KEYSTORE_PASSWORD: ${{ secrets.TERRA_KEYSTORE_PASSWORD }}
          TERRA_KEY_ALIAS: terra
          TERRA_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/terra.apk"

      - name: Wydanie z plikiem terra.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" terra.apk \
            --title "Terra 0.1.${{ github.run_number }}" \
            --notes "Wersja testowa Terra na Androida. Instalacja: pobierz terra.apk na telefonie i otwórz plik." \
            --latest
